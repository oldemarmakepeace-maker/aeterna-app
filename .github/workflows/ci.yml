name: AETERNA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Dummy values for CI — tests use mocks, no real connections
  SUPABASE_URL: "https://ci.supabase.co"
  SUPABASE_ANON_KEY: "ci-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "ci-service-role-key"
  SUPABASE_JWT_SECRET: "ci-jwt-secret-at-least-32-chars-long!"
  DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"

jobs:
  # ── Backend (Python) ────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run pytest
        run: pytest -v --tb=short

  # ── Frontend (Node.js) ─────────────────────────────────────
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
